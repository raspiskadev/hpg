<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HPG Tactical Dispatcher Console</title>
  
  <!-- Leaflet CSS for Map Rendering -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { display: flex; height: 100vh; background: #0f172a; color: #f8fafc; overflow: hidden; }

    /* Column Layouts */
    #sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; padding: 15px; gap: 15px; overflow-y: auto; }
    #main-content { flex: 1; display: flex; flex-direction: column; }
    #map { flex: 1; width: 100%; background: #020617; }
    #communication-panel { height: 280px; background: #0f172a; border-top: 1px solid #334155; display: flex; padding: 15px; gap: 15px; }

    /* Cards & Components */
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; }
    h3 { font-size: 13px; text-transform: uppercase; color: #94a3b8; margin-bottom: 8px; letter-spacing: 0.5px; }

    /* Dropdowns & Buttons */
    select, input[type="text"], button { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #334155; color: white; outline: none; margin-bottom: 8px; font-size: 13px; }
    button { background: #2563eb; font-weight: bold; cursor: pointer; transition: background 0.2s; border: none; }
    button:hover { background: #1d4ed8; }

    /* Action Modifiers */
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-warning { background: #d97706; }
    .btn-warning:hover { background: #b45309; }

    /* Push-to-Talk (PTT) Master Button */
    #ptt-btn { height: 50px; background: #16a34a; font-size: 15px; user-select: none; }
    #ptt-btn:active { background: #15803d; transform: scale(0.98); }

    /* Chat Terminal */
    #chat-box { flex: 1; display: flex; flex-direction: column; }
    #chat-messages { flex: 1; background: #020617; border-radius: 6px; padding: 10px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #334155; margin-bottom: 8px; }
    .msg { padding: 6px 10px; border-radius: 4px; max-width: 80%; }
    .msg-sent { background: #1e40af; align-self: flex-end; }
    .msg-recv { background: #334155; align-self: flex-start; }

    /* Video Monitor Container */
    #video-container { width: 300px; background: #000; border-radius: 8px; border: 1px solid #334155; overflow: hidden; position: relative; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .video-label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.7); padding: 3px 8px; font-size: 11px; border-radius: 4px; border: 1px solid #475569; }

    /* System Status Header Bar */
    #status-badge { font-size: 11px; font-weight: bold; padding: 6px; border-radius: 4px; text-align: center; letter-spacing: 0.5px; }
    .online { background: #15803d; color: #f8fafc; }
    .offline { background: #b91c1c; color: #f8fafc; }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR: UNIT STATUS & COMMAND OVERRIDES -->
  <div id="sidebar">
    <div id="status-badge" class="offline">CONNECTING TO DISPATCH ENGINE...</div>

    <div class="card">
      <h3>Target Field Unit</h3>
      <select id="target-unit-select">
        <option value="ALL">Broadcast to All (Group)</option>
        <option value="HPG_UNIT_1">HPG Unit 1</option>
        <option value="HPG_UNIT_2">HPG Unit 2</option>
      </select>
    </div>

    <!-- Push-To-Talk Radio -->
    <div class="card">
      <h3>Tactical Radio (PTT)</h3>
      <button id="ptt-btn">HOLD TO TALK (PTT)</button>
    </div>

    <!-- Emergency Overrides -->
    <div class="card">
      <h3>Dispatch Overrides</h3>
      <button id="btn-force-cam" class="btn-warning">Force Remote Camera</button>
      <button id="btn-force-mic" class="btn-warning">Force Remote Mic Stream</button>
      <button id="btn-force-alarm" class="btn-danger">Trigger Remote Siren</button>
      <button id="btn-ping-telemetry">Ping Unit Telemetry</button>
    </div>

    <!-- Audio/Video Controls -->
    <div class="card">
      <h3>WebRTC Calling</h3>
      <button id="btn-call-unit">Start Video Feed</button>
      <button id="btn-end-call" class="btn-danger">End Video Feed</button>
    </div>
  </div>

  <!-- MAIN AREA: LEAFLET MAP & COMMUNICATION PANEL -->
  <div id="main-content">
    <div id="map"></div>

    <div id="communication-panel">
      <!-- Chat Terminal -->
      <div id="chat-box" class="card">
        <h3>Dispatch Command Terminal</h3>
        <div id="chat-messages">
          <div class="msg msg-recv"><b>System:</b> Tactical Dispatch Console Ready.</div>
        </div>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="chat-input" placeholder="Type task or command..." style="margin-bottom:0;" />
          <button id="btn-send-chat" style="width: 100px;">Send</button>
        </div>
      </div>

      <!-- Remote Video Monitor -->
      <div id="video-container">
        <video id="remote-video" autoplay playsinline muted></video>
        <div class="video-label">LIVE STREAM: <span id="video-unit-name">NONE</span></div>
      </div>
    </div>
  </div>

  <!-- External JS Libraries -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- Main Controller Application -->
  <script>
    // 1. Initialize Map Centered on Manila
    const map = L.map('map').setView([14.5995, 120.9842], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap'
    }).addTo(map);

    const markers = {};
    const statusBadge = document.getElementById('status-badge');

    // 2. Socket.IO Connection Setup
    const socket = io(window.location.origin, {
      query: { role: "DISPATCHER", unit_id: "DISPATCH_MAIN" }
    });

    socket.on('connect', () => {
      console.log("[SOCKET] Connected to Render Dispatch Engine");
      statusBadge.innerText = "SYSTEM: DISPATCH CONSOLE ONLINE";
      statusBadge.className = "online";
    });

    socket.on('disconnect', () => {
      console.warn("[SOCKET] Connection lost");
      statusBadge.innerText = "SYSTEM: DISCONNECTED";
      statusBadge.className = "offline";
    });

    // 3. Live Telemetry Listener (Draws and Updates Map Markers)
    socket.on('TELEMETRY_UPDATE', (data) => {
      console.log("[TELEMETRY RECEIVED]", data);

      const unitId = data.unit_id || "HPG_UNIT_1";
      const lat = Number(data.lat || data.latitude);
      const lng = Number(data.lng || data.longitude);

      // Validate coordinates (Skip 0.0 null island)
      if (!lat || !lng || (lat === 0 && lng === 0)) {
        console.warn(`[MAP] Ignored invalid coordinates for ${unitId}: (${lat}, ${lng})`);
        return;
      }

      // Add unit to target select dropdown if not already present
      const targetSelect = document.getElementById('target-unit-select');
      let exists = false;
      for (let i = 0; i < targetSelect.options.length; i++) {
        if (targetSelect.options[i].value === unitId) { exists = true; break; }
      }
      if (!exists) {
        const opt = document.createElement('option');
        opt.value = unitId;
        opt.innerText = unitId;
        targetSelect.appendChild(opt);
      }

      // Create marker or update position
      if (!markers[unitId]) {
        markers[unitId] = L.marker([lat, lng]).addTo(map);
        map.setView([lat, lng], 15); // Auto-focus first report
      } else {
        markers[unitId].setLatLng([lat, lng]);
      }

      markers[unitId].bindPopup(`
        <b>${unitId}</b><br>
        Speed: ${data.speed || 0} km/h<br>
        Battery: ${data.battery || 0}%<br>
        Status: ${data.status || 'PATROLLING'}
      `);
    });

    // 4. Remote Override Commands Handler
    function sendDispatchOverride(action) {
      const selectedUnit = document.getElementById('target-unit-select').value;
      socket.emit('DISPATCH_COMMAND', {
        target_unit: selectedUnit,
        action: action,
        timestamp: new Date()
      });

      appendChatMessage("System", `Command Dispatched: [${action}] -> Target: ${selectedUnit}`);
    }

    document.getElementById('btn-force-cam').addEventListener('click', () => sendDispatchOverride('FORCE_CAMERA_STREAM'));
    document.getElementById('btn-force-mic').addEventListener('click', () => sendDispatchOverride('FORCE_MIC_STREAM'));
    document.getElementById('btn-force-alarm').addEventListener('click', () => sendDispatchOverride('FORCE_ALARM'));
    document.getElementById('btn-ping-telemetry').addEventListener('click', () => sendDispatchOverride('PING_TELEMETRY'));

    // 5. PTT Voice Engine (Record and Stream via Sockets)
    let mediaRecorder = null;
    const pttBtn = document.getElementById('ptt-btn');

    pttBtn.addEventListener('mousedown', async () => {
      const selectedUnit = document.getElementById('target-unit-select').value;
      pttBtn.style.background = "#dc2626";
      pttBtn.innerText = "TRANSMITTING VOICE...";

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            const reader = new FileReader();
            reader.onloadend = () => {
              socket.emit('AUDIO_STREAM_CHUNK', {
                target_unit: selectedUnit,
                sender: 'DISPATCH_MAIN',
                audio_data: reader.result
              });
            };
            reader.readAsArrayBuffer(event.data);
          }
        };

        mediaRecorder.start(250); // Send 250ms chunks for real-time audio
      } catch (err) {
        console.error("PTT Mic error:", err);
        alert("Microphone permission required for Push-To-Talk.");
        stopPTT();
      }
    });

    pttBtn.addEventListener('mouseup', stopPTT);
    pttBtn.addEventListener('mouseleave', stopPTT);

    function stopPTT() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(track => track.stop());
      }
      pttBtn.style.background = "#16a34a";
      pttBtn.innerText = "HOLD TO TALK (PTT)";
    }

    // 6. Text Chat Handler
    function appendChatMessage(sender, text) {
      const chatBox = document.getElementById('chat-messages');
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${sender === 'DISPATCH_MAIN' ? 'msg-sent' : 'msg-recv'}`;
      msgDiv.innerHTML = `<b>${sender}:</b> ${text}`;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    document.getElementById('btn-send-chat').addEventListener('click', () => {
      const input = document.getElementById('chat-input');
      if (input.value.trim() !== '') {
        const text = input.value;
        const target = document.getElementById('target-unit-select').value;

        socket.emit('CHAT_MESSAGE', {
          target_unit: target,
          sender: 'DISPATCH_MAIN',
          text: text
        });

        appendChatMessage('DISPATCH_MAIN', text);
        input.value = '';
      }
    });

    socket.on('CHAT_MESSAGE', (data) => {
      appendChatMessage(data.sender || 'FIELD_UNIT', data.text);
    });
  </script>
</body>
</html>
