<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOGE Telemetry Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { background-color: #090d16; color: #e2e8f0; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden font-sans">

  <!-- TOP BAR -->
  <header class="h-14 bg-slate-950 border-b border-slate-800 px-6 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <span class="h-3 w-3 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="font-black tracking-wider text-sm text-white">VOGE LIVE TELEMETRY</span>
    </div>
    <span id="unit-tag" class="font-mono text-xs text-cyan-400 bg-slate-900 border border-slate-800 px-2 py-1 rounded">VOGE-500AC-01</span>
  </header>

  <!-- CONTENT -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT SIDEBAR: 3D MODEL & METRICS -->
    <aside class="w-96 border-r border-slate-800 bg-slate-950 p-4 flex flex-col gap-4 shrink-0 overflow-y-auto">
      
      <!-- 3D MOTORCYCLE VIEWPORT -->
      <div class="bg-slate-900 rounded-xl border border-slate-800 p-3">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block mb-2">3D Vehicle Attitude</span>
        <div id="canvas-container" class="w-full h-52 bg-slate-950 rounded-lg overflow-hidden border border-slate-800"></div>
        
        <div class="grid grid-cols-2 gap-2 mt-3">
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
            <span class="text-[10px] text-slate-500 font-bold uppercase block">Lean (Roll)</span>
            <span id="txt-roll" class="text-xl font-mono font-black text-cyan-400">0.0°</span>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 text-center">
            <span class="text-[10px] text-slate-500 font-bold uppercase block">Pitch</span>
            <span id="txt-pitch" class="text-xl font-mono font-black text-cyan-400">0.0°</span>
          </div>
        </div>
      </div>

      <!-- GPS & SPEED METRICS -->
      <div class="bg-slate-900 rounded-xl border border-slate-800 p-3 space-y-2">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-400 block">GPS Dynamics</span>
        
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
            <span class="text-[10px] text-slate-500 font-bold uppercase block">Speed</span>
            <div class="flex items-baseline gap-1">
              <span id="txt-speed" class="text-2xl font-mono font-black text-emerald-400">0.0</span>
              <span class="text-xs text-slate-500">km/h</span>
            </div>
          </div>
          <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800">
            <span class="text-[10px] text-slate-500 font-bold uppercase block">Heading</span>
            <div class="flex items-baseline gap-1">
              <span id="txt-heading" class="text-2xl font-mono font-black text-emerald-400">0°</span>
              <span id="txt-cardinal" class="text-xs text-slate-400 font-bold">N</span>
            </div>
          </div>
        </div>

        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 font-mono text-xs flex justify-between">
          <span class="text-slate-500 font-sans text-[10px] font-bold uppercase">Coordinates</span>
          <span id="txt-coords" class="text-slate-200 font-bold">14.59950, 120.98420</span>
        </div>
      </div>

    </aside>

    <!-- RIGHT SIDE: LIVE MAP -->
    <main class="flex-1 h-full bg-slate-950">
      <div id="map"></div>
    </main>

  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // --- LEAFLET MAP ---
    const map = L.map('map', { zoomControl: false }).setView([14.5995, 120.9842], 16);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
    let marker = null;

    // --- THREE.JS 3D MOTORCYCLE ---
    let scene, camera, renderer, bikeGroup;
    let targetRoll = 0, targetPitch = 0;
    let currentRoll = 0, currentPitch = 0;

    function init3D() {
      const container = document.getElementById('canvas-container');
      const w = container.clientWidth, h = container.clientHeight;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
      camera.position.set(2.8, 1.8, 3.2);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(w, h);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const dirLight = new THREE.DirectionalLight(0x00e676, 1.2);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      // Build Motorcycle Mesh
      bikeGroup = new THREE.Group();

      // Frame
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.45, 0.35),
        new THREE.MeshStandardMaterial({ color: 0x00bcd4, metalness: 0.6, roughness: 0.3 })
      );
      bikeGroup.add(body);

      // Wheels
      const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 });
      const wheelGeo = new THREE.CylinderGeometry(0.28, 0.28, 0.12, 20);

      const fWheel = new THREE.Mesh(wheelGeo, wheelMat);
      fWheel.rotation.z = Math.PI / 2;
      fWheel.position.set(0.65, -0.22, 0);
      bikeGroup.add(fWheel);

      const rWheel = new THREE.Mesh(wheelGeo, wheelMat);
      rWheel.rotation.z = Math.PI / 2;
      rWheel.position.set(-0.65, -0.22, 0);
      bikeGroup.add(rWheel);

      scene.add(bikeGroup);

      // 60 FPS LERP Render Loop for smooth zero-lag animation
      function animate() {
        requestAnimationFrame(animate);
        currentRoll += (targetRoll - currentRoll) * 0.25;
        currentPitch += (targetPitch - currentPitch) * 0.25;

        if (bikeGroup) {
          bikeGroup.rotation.x = currentRoll;
          bikeGroup.rotation.z = currentPitch;
        }
        renderer.render(scene, camera);
      }
      animate();
    }
    window.addEventListener('load', init3D);

    // --- SOCKET.IO REALTIME TELEMETRY ---
    const socket = io(window.location.origin);

    socket.on('TELEMETRY_UPDATE', (data) => {
      if (!data) return;

      // Update 3D Model Targets
      if (data.telemetry) {
        const rollDeg = Number(data.telemetry.lean_angle_deg || 0);
        const pitchDeg = Number(data.telemetry.pitch_deg || 0);

        targetRoll = (rollDeg * Math.PI) / 180.0;
        targetPitch = (-pitchDeg * Math.PI) / 180.0;

        document.getElementById('txt-roll').innerText = `${rollDeg.toFixed(1)}°`;
        document.getElementById('txt-pitch').innerText = `${pitchDeg.toFixed(1)}°`;
      }

      // Update GPS & Speed UI
      const lat = Number(data.lat || 0);
      const lng = Number(data.lng || 0);
      const speed = Number(data.speed || 0);
      const heading = Number(data.heading || 0);

      document.getElementById('txt-speed').innerText = speed.toFixed(1);
      document.getElementById('txt-heading').innerText = `${Math.round(heading)}°`;
      document.getElementById('txt-cardinal').innerText = getCardinal(heading);
      document.getElementById('txt-coords').innerText = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;

      // Update Map Marker & Smooth Pan
      if (lat && lng) {
        const pos = [lat, lng];
        if (!marker) {
          marker = L.marker(pos).addTo(map);
          map.setView(pos, 16);
        } else {
          marker.setLatLng(pos);
          map.panTo(pos, { animate: true, duration: 0.3 });
        }
      }
    });

    function getCardinal(deg) {
      const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
      return dirs[Math.round(((deg %= 360) < 0 ? deg + 360 : deg) / 45) % 8];
    }
  </script>
</body>
</html>
